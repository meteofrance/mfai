# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    env:
      PYTHONPATH: '.'
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Gather Python changed files
      id: changed-py-files
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        files: |
          *.py
          **/*.py
          pyproject.toml

    - name: Lint with ruff
      if: steps.changed-py-files.outputs.any_changed == 'true'
      run: |
        pip install ruff==0.15.9
        ruff format --check ${{ steps.changed-py-files.outputs.all_changed_files }}
        ruff check ${{ steps.changed-py-files.outputs.all_changed_files }}

  tests:
    env:
      PYTHONPATH: '.'
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install git  # necessary for the checkout and changed-py-files actions
      run: apt-get update && apt-get install -y git

    - name: Gather Python changed files
      if: github.event_name == 'pull_request'
      id: changed-py-files
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        files: |
          *.py
          **/*.py
          pyproject.toml

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0
      if: github.event_name != 'pull_request' || steps.changed-py-files.outputs.any_changed == 'true' 
      with:
        python-version: 3.11
        enable-cache: true

    - name: Install dependencies
      if: github.event_name != 'pull_request' || steps.changed-py-files.outputs.any_changed == 'true' 
      run: |
        uv sync --extra llm --extra weather_forecast --extra vision_transformers --extra dev
        uv pip install mlflow

    - name: Type hinting with mypy on changed files
      if: github.event_name != 'pull_request' || steps.changed-py-files.outputs.any_changed == 'true'
      run: |
        uv run pyright

    - name: Test with pytest
      if: github.event_name != 'pull_request' || steps.changed-py-files.outputs.any_changed == 'true'
      run: |
        uv run pytest --cov=mfai --cov-fail-under=85 tests/